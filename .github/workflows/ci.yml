name: Build and Deploy Vue Project to GitHub Pages

on:
  push:
    branches:
      - main  # 主分支名，如你是 master，请改成 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # 或你项目需要的版本

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: npm install

      # 4️⃣ 构建 Vue 项目
      - name: Build project
        run: npm run build

      # 5️⃣ 清理不需要的文件（可选）
      # 确保 log 文件夹和根目录 md 不被部署
      - name: Clean unnecessary files
        run: |
          rm -rf dist/log
          find dist -name "*.md" -type f -delete || true

      # 6️⃣ 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false  # 每次清空 gh-pages 分支，保证干净部署

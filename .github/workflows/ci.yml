name: Build & Deploy Vue Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ 设置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4️⃣ 构建 Vue 项目
      - name: Build Vue project
        run: npm run build

      # 5️⃣ 部署到 GitHub Pages（保留 gh-pages 其他文件，忽略 log 文件夹）
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # 排除 log 文件夹
          exclude_assets: log/** 
          # 保留 gh-pages 上其他文件
          keep_files: true
          user_name: github-actions
          user_email: github-actions@github.com
